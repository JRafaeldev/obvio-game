<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F7ECDD">
    <meta name="description" content="ÓBVIO? Um jogo de perguntas com Pisco e Fino.">
    <title>ÓBVIO? — com Pisco e Fino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/home.css">
    <link rel="stylesheet" href="./css/game.css">
    <link rel="stylesheet" href="./css/stages.css">
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="screen home-screen is-active" id="home-screen" aria-labelledby="home-title">
        <header class="brand">
          <h1 class="brand__title" id="home-title">ÓBVIO<span class="brand__question">?</span></h1>
          <p class="brand__subtitle">com <strong>Pisco</strong> e <strong>Fino</strong></p>
        </header>

        <div class="home-stage">
          <!-- Pisco: ilustração oficial à esquerda do menu. -->
          <figure class="character character--pisco">
            <img class="character__image" src="./assets/images/pisco.png" alt="Pisco, personagem de cabelo longo e terno preto, com luvas brancas e bengala dourada" width="1086" height="1448" decoding="async">
          </figure>

          <nav class="home-menu" aria-label="Menu principal">
            <p class="home-menu__prompt">Parece fácil, né?</p>
            <button class="menu-button menu-button--primary" id="play-button" type="button">JOGAR <span aria-hidden="true">↗</span></button>
            <button class="menu-button menu-button--secondary" id="rules-button" type="button">COMO FUNCIONA</button>
            <button class="menu-button menu-button--secondary" id="credits-button" type="button">CRÉDITOS</button>
          </nav>

          <!-- Fino: ilustração oficial à direita do menu. -->
          <figure class="character character--fino">
            <img class="character__image" src="./assets/images/fino.png" alt="Fino, feneco de orelhas grandes, cauda volumosa e terno vermelho com gravata-borboleta preta" width="1086" height="1448" decoding="async">
          </figure>
        </div>

        <footer class="home-footer">
          <p class="record">MELHOR FASE <strong id="record-value">00</strong></p>
          <button class="sound-button" id="sound-button" type="button" aria-pressed="true" aria-label="Desativar som">SOM <span id="sound-status">LIGADO</span><span class="sound-button__dot" aria-hidden="true"></span></button>
        </footer>
      </section>

      <section class="screen game-screen" id="game-screen" aria-labelledby="phase-label" hidden>
        <div class="game-layout">
          <header class="game-topbar">
            <span class="game-topbar__brand">ÓBVIO?</span>
            <p class="game-card__phase" id="phase-label">FASE 01</p>
            <button class="sound-button sound-button--game" id="game-sound-button" type="button" aria-pressed="true" aria-label="Desativar som">SOM <span id="game-sound-status">LIGADO</span><span class="sound-button__dot" aria-hidden="true"></span></button>
          </header>
          <div class="game-card">
            <div class="game-card__header">
              <p class="game-card__eyebrow" id="stage-eyebrow">PARECE FÁCIL...</p>
              <img class="game-card__portrait" id="phase-portrait" src="./assets/images/piscoretrato.png" alt="Retrato de Pisco" width="1254" height="1254" decoding="async">
            </div>
            <h2 class="game-card__question" id="question-text">Qual palavra aparece no título deste jogo?</h2>
            <div class="stage-scene" id="stage-scene"></div>
            <div class="answers" id="answers" role="group" aria-label="Alternativas"></div>
            <p class="game-card__feedback" id="game-feedback" role="status" aria-live="polite"></p>
            <div class="game-card__actions">
              <button class="back-button" id="back-button" type="button">← VOLTAR AO MENU</button>
            </div>
          </div>
          <section class="result-card" id="result-card" aria-labelledby="result-title" hidden>
            <div class="result-card__mascots" aria-hidden="true">
              <div class="result-card__mascot"><span class="result-card__bubble" id="result-pisco-bubble"></span><img src="./assets/images/pisco.png" alt="" width="1086" height="1448"></div>
              <div class="result-card__mascot"><span class="result-card__bubble" id="result-fino-bubble"></span><img src="./assets/images/fino.png" alt="" width="1086" height="1448"></div>
            </div>
            <p class="result-card__eyebrow" id="result-eyebrow"></p>
            <h2 id="result-title" tabindex="-1"></h2>
            <p id="result-message"></p>
            <button class="menu-button menu-button--primary result-card__retry" id="retry-button" type="button">TENTAR NOVAMENTE</button>
            <button class="back-button" id="result-back-button" type="button">← VOLTAR AO MENU</button>
          </section>
          <div class="dev-panel" id="dev-panel" hidden>
            <label for="dev-phase">Teste local · fase</label>
            <select id="dev-phase"></select>
            <button id="dev-load" type="button">Abrir fase</button>
            <button id="dev-win" type="button">Testar acerto</button>
            <button id="dev-lose" type="button">Testar erro</button>
          </div>
        </div>
      </section>
    </main>

    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <section class="modal" id="info-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
        <button class="modal__close" id="modal-close" type="button" aria-label="Fechar janela">×</button>
        <p class="modal__eyebrow">ÓBVIO?</p>
        <h2 id="modal-title"></h2>
        <div class="modal__body" id="modal-body"></div>
      </section>
    </div>
  </body>
</html>
